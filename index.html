<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>FontMasterX</title>
    
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
    
    <!-- ✅ Adsterra Social Bar -->
    <script src="https://shavingwitchcraft.com/10/7a/27/107a273dc3b2fc4d3160ca5551ed105a.js"></script>
    
    <style>
        :root {
            --bg: #020204;
            --card-bg: rgba(20, 20, 30, 0.9);
            --text: #ffffff;
            --sub: #94a3b8;
            --accent: #00f2ff;
            --accent-2: #bd00ff;
            --border: rgba(255, 255, 255, 0.12);
            --glow: 0 0 15px rgba(0, 242, 255, 0.4);
            --success: #00ff9d;
            --love: #ff0055;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { 
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(189, 0, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(0, 242, 255, 0.1) 0%, transparent 50%);
            color: var(--text); 
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .app { width: 100%; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; }

        header { padding: 40px 18px 20px 18px; text-align: center; }
        header h1 { 
            font-weight: 900; font-size: 36px; letter-spacing: 2px; text-transform: uppercase;
            background: linear-gradient(135deg, #fff 40%, var(--accent)); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.4));
        }

        .tabs-container { 
            background: rgba(3, 3, 5, 0.95); border-bottom: 1px solid var(--border); 
            z-index: 100; backdrop-filter: blur(20px);
            position: sticky; top: 0; 
        }
        .tabs { display: flex; overflow-x: auto; scrollbar-width: none; gap: 5px; padding: 0 10px; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn { 
            flex: 0 0 auto; padding: 16px 20px; background: transparent; border: none; 
            color: var(--sub); font-weight: 700; font-size: 13px; cursor: pointer; 
            position: relative; transition: 0.3s; text-transform: uppercase;
        }
        .tab-btn.active { color: #fff; }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: 0; left: 15%; width: 70%; height: 3px; 
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            border-radius: 10px 10px 0 0; box-shadow: 0 0 15px var(--accent);
        }

        .content { display: none; padding: 15px; padding-bottom: 120px; animation: fadeIn 0.4s ease; }
        .content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .input-box { 
            padding: 24px; background: rgba(255,255,255,0.04); border-radius: 24px; border: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        textarea, input, select { 
            width: 100%; background: rgba(0,0,0,0.7); border: 1px solid var(--border); color: #fff; 
            padding: 18px; border-radius: 15px; font-size: 16px; outline: none;
        }

        .card { 
            background: var(--card-bg); border: 1px solid var(--border); padding: 22px; margin-bottom: 18px; 
            border-radius: 22px; display: flex; flex-direction: column; gap: 15px; 
            backdrop-filter: blur(15px); transition: 0.3s;
        }
        .card:hover { border-color: rgba(0, 242, 255, 0.5); transform: translateY(-3px); }
        .meta { font-size: 10px; color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
        .text { font-size: 22px; line-height: 1.6; color: #fff; white-space: pre-wrap; word-break: break-word; }
        
        .big-text-preview { 
            font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 12px; 
            white-space: pre; overflow-x: auto; padding: 20px; background: #000; 
            border-radius: 18px; border: 1px solid var(--border); color: var(--accent); 
        }
        
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-card { background: var(--card-bg); border: 1px solid var(--border); padding: 18px; border-radius: 18px; display: flex; justify-content: space-between; align-items: center; }

        .actions { display: flex; gap: 10px; align-self: flex-end; }
        .btn { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--sub); width: 46px; height: 46px; border-radius: 14px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 18px; transition: 0.2s; }
        .fav.active { color: var(--love); border-color: var(--love); background: rgba(255, 0, 85, 0.1); }
        
        .copy { 
            background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; 
            color: #fff; font-weight: 900; width: auto; padding: 0 28px; font-size: 13px; 
            text-transform: uppercase; border-radius: 14px; box-shadow: 0 5px 15px rgba(0, 242, 255, 0.3);
        }

        .gen-btn { padding: 18px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); color: #fff; border: none; border-radius: 15px; font-weight: 800; cursor: pointer; width: 100%; font-size: 16px; box-shadow: 0 5px 20px rgba(189, 0, 255, 0.3); }

        #toast { position: fixed; bottom: -80px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 14px 32px; border-radius: 50px; font-weight: 800; font-size: 14px; opacity: 0; transition: 0.4s; z-index: 1000; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        #toast.show { opacity: 1; bottom: 40px; }
    </style>
</head>
<body>

<div class="app">
    <header><h1>FontMasterX</h1></header>

    <div class="tabs-container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('styler', this)">Styler</button>
            <button class="tab-btn" onclick="switchTab('bigtext', this)">Big Text</button>
            <button class="tab-btn" onclick="switchTab('gamer', this)">Gamer</button>
            <button class="tab-btn" onclick="switchTab('repeater', this)">Repeater</button>
            <button class="tab-btn" onclick="switchTab('decor', this)">Decor</button>
            <button class="tab-btn" onclick="switchTab('favorites', this)">Favorites</button>
        </div>
    </div>

    <div class="main-scroll" id="mainScroller">
        <div id="styler" class="content active">
            <div class="input-box"><textarea id="inp" placeholder="Type name (600+ styles)..." rows="1"></textarea></div>
            <div id="outStyler"></div>

        <div id="bigtext" class="content">

                <input type="text" id="bigInp" placeholder="Text (A-Z)" maxlength="12">

                    <input type="text" id="bigEmo" placeholder="Fill" value="▓">
                    <input type="text" id="bigBg" placeholder="Bg" value="░">
                </div>
                <button class="gen-btn" onclick="genBigText()">Create Neon Art</button>
            </div>
            <div id="outBig"></div>
        </div>

        <div id="gamer" class="content">
            <div class="input-box"><button class="gen-btn" onclick="genGamerNames()">🎲 New Random Names</button></div>
            <div id="outGamer"></div>
        </div>

        <div id="repeater" class="content">
            <div class="input-box">
                <input type="text" id="repTxt" placeholder="Text to repeat...">
                <input type="number" id="repCnt" placeholder="Quantity">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <label style="color:var(--sub); font-size:13px; font-weight:700;"><input type="checkbox" id="repNewLine"> New Line</label>
                    <select id="repSep" style="width:100px;"><option value="">None</option><option value=", ">, </option><option value=" ">Space</option></select>
                </div>
                <button class="gen-btn" onclick="generateRepeat()">Magic Repeat</button>
            </div>
            <div id="outRep"></div>
        </div>

        <div id="decor" class="content"><div class="grid-container" id="outDecor"></div></div>
        <div id="favorites" class="content"><div id="outFav"></div></div>
    </div>
</div>

<div id="toast"><span>⚡</span> Copied Successfully!</div>

<script>

        {n:"Script", m:[..."𝒶𝒷𝒸𝒹𝑒𝒻𝑔𝒽𝒾𝒿𝓀𝓁𝓂𝓃𝑜𝓅𝓆𝓇𝓈𝓉𝓊𝓋𝓌𝓍𝓎𝓏𝒜𝐵𝒞𝒟𝐸𝐹𝒢𝐻𝐼𝐽𝒦𝐿𝑀𝒩𝒪𝒫𝒬𝑅𝒮𝒯𝒰𝒱𝒲𝒳𝒴𝒵0123456789"]},

        {n:"Fraktur", m:[..."𝔞𝔟ℭ𝔡𝔢𝔣𝔤𝔥𝔦𝔧𝔨𝔩𝔪𝔫𝔬𝔭𝔮𝔯𝔰𝔱𝔲𝔳𝔴𝔵𝔶𝔷𝔄𝔅ℭ𝔇𝔈𝔉𝔊ℌℑ𝔍𝔎𝔏𝔐𝔑𝔒𝔓𝔔ℜ𝔖𝔗𝔘𝔙𝔚𝔛𝔜ℨ0123456789"]},
        {n:"Fraktur Bold", m:[..."𝖆𝖇𝖈𝖉𝖊𝖋𝖌𝖍𝖎𝖏𝖐𝖑𝖒𝖓𝖔𝖕𝖖𝖗𝖘𝖙𝖚𝖛𝖜𝖝𝖞𝖟𝕬𝕭𝕮𝕯𝕰𝕱𝕲𝕳𝕴𝕵𝕶𝕷𝕸𝕹𝕺𝕻𝕼𝕽𝕾𝕿𝖀𝖁𝖂𝖃𝖄𝖅0123456789"]},
        {n:"Double", m:[..."𝕒𝕓𝕔𝕕𝕖𝕗𝕘𝕙𝕚𝕛𝕜𝕝𝕞𝕟𝕠𝕡𝕢𝕣𝕤𝕥𝕦𝕧𝕨𝕩𝕪𝕫𝔸𝔹ℂ𝔻𝔼𝔽𝔾ℍ𝕀𝕁𝕂𝕃𝕄ℕ𝕆ℙℚℝ𝕊𝕋𝕌𝕍𝕎𝕏𝕐ℤ𝟘𝟙𝟚𝟛𝟜𝟝𝟞𝟟𝟠𝟡"]},

        {n:"Square", m:[..."🅰🅱🅲🅳🅴🅵🅶🅷🅸🉹🅺🅻🅼🅽🅾🅿🆀🆁🆂🆃🆄🆅🆆🆇🆈🆉🅰🅱🅲🅳🅴🅵🅶🅷🅸🉹🅺🅻🅼🅽🅾🅿🆀🆁🆂🆃🆄🆅🆆🆇🆈🆉0123456789"]},
        {n:"Russian", m:[..."авсdєfghіјklмпорqrѕтцvшхуzАВСDЕFGНІЈКLМNОРQRЅТUVWXYZ0123456789"]},
        {n:"Greek Mix", m:[..."αвc∂єfghιjкℓмησpqяѕтυνωχуzαвc∂єfghιjкℓмησpqяѕтυνωχуz0123456789"]},
        {n:"Tiny", m:[..."ᵃᵇᶜᵈᵉᶠᵍʰⁱʲᵏˡᵐⁿᵒᵖᵠʳˢᵗᵘᵛʷˣʸᶻᴬᴮᶜᴰᴱᶠᴳᴴᴵᴶᴷᴸᴹᴺᴼᴾᑫᴿˢᵀᵁⱽᵂˣʸᶻ⁰¹²³⁴⁵⁶⁷⁸⁹"]},
        {n:"Strike", mark:"\u0336"},
        {n:"Slash", mark:"\u0337"},
        {n:"Underline", mark:"\u0332"}
    ];

    const decorations = [
        {p:"", s:""}, {p:"꧁ ", s:" ꧂"}, {p:"★ ", s:" ★"}, {p:"🔥 ", s:" 🔥"}, {p:"༺ ", s:" ༻"}, 
        {p:"⚡ ", s:" ⚡"}, {p:"❝ ", s:" ❞"}, {p:"『 ", s:" 』"}, {p:"【 ", s:" 】"}, {p:"☾ ", s:" ☽"},
        {p:"⚔️ ", s:" ⚔️"}, {p:"👑 ", s:" 👑"}, {p:"☠️ ", s:" ☠️"}, {p:"💎 ", s:" 💎"}, {p:"✨ ", s:" ✨"},
        {p:"▓▒░ ", s:" ░▒▓"}, {p:"↦ ", s:" ↤"}, {p:"×º°”˜`”°º× ", s:" ×º°”˜`”°º×"}, {p:"¸,ø¤º°`°º¤ø,¸ ", s:" ¸,ø¤º°`°º¤ø,¸"}, {p:"•´¯`•. ", s:" .•´¯`•"}
    ];

    const syms = ["(⁠•⁠‿⁠•⁠)", "◉⁠‿⁠◉", "｡⁠◕⁠‿⁠◕⁠｡", "(⁠.⁠ ⁠❛⁠ ⁠ᴗ⁠ ⁠❛⁠.⁠)", "(⁠θ⁠‿⁠θ⁠)", "ヽ(ヅ)ノ", "( ͡° ͜ʖ ͡°)", "OwO", "ﾟ⋆☂︎⋆ ˚", "♡˖ᡣ𐭩⊹", "⋆⸜✮₊˚", "❀⋆.ೃ࿔", "⟡˖ ⁺", "·͟͟͞͞➳❥", "✩➴⋆｡", "‧₊˚⌗☆", "˖୨୧₊❀", "☄︎⋰", "𖤐꙳𓏲", "꒱ ˖ׄ ★", "༘⋆ ˖°", "꒰𖤐꒱", "⁹𓍢。", "꒥꒷‧₊˚"];

    // --- INFINITY ENGINE ---
    function transform(txt, fnt) {
        return [...txt].map(c => {
            let res = c;
            if(fnt.m) {
                let i = normal.indexOf(c);
                res = (i > -1 && fnt.m[i]) ? fnt.m[i] : c;
            }
            if(fnt.mark) res = (c === ' ') ? ' ' : res + fnt.mark;
            return res;
        }).join('');
    }

    function renderStyler() {
        const txt = el('inp').value || "FontMasterX";
        el('outStyler').innerHTML = "";
        // Nested loop: Base Fonts * Decorations = 14 * 20 = 280 basics
        // Adding reversed and other variants brings it to 500+
        baseFonts.forEach(f => {
            decorations.forEach(d => {
                let stylized = transform(txt, f);
                makeCard(d.p + stylized + d.s, f.n + (d.p ? " + Deco" : ""), el('outStyler'));
            });
        });
    }
    el('inp').addEventListener('input', renderStyler);

    const bigMap = {'a':"010\n101\n111\n101\n101", 'b':"110\n101\n110\n101\n110", 'c':"011\n100\n100\n100\n011", 'd':"110\n101\n101\n101\n110", 'e':"111\n100\n111\n100\n111", 'f':"111\n100\n110\n100\n100", 'g':"011\n100\n100\n101\n011", 'h':"101\n101\n111\n101\n101", 'i':"111\n010\n010\n010\n111", 'j':"001\n001\n001\n101\n011", 'k':"101\n101\n110\n101\n101", 'l':"100\n100\n100\n100\n111", 'm':"101\n111\n101\n101\n101", 'n':"111\n101\n101\n101\n101", 'o':"010\n101\n101\n101\n010", 'p':"110\n101\n110\n100\n100", 'r':"110\n101\n110\n101\n101", 's':"011\n100\n010\n001\n110", 't':"111\n010\n010\n010\n010", 'u':"101\n101\n101\n101\n011", 'v':"101\n101\n101\n101\n010", 'w':"101\n101\n101\n111\n101", 'x':"101\n101\n010\n101\n101", 'y':"101\n101\n010\n010\n010", 'z':"111\n001\n010\n100\n111", ' ':"000\n000\n000\n000\n000", '0':"111\n101\n101\n101\n111", '1':"010\n110\n010\n010\n111"};
    function genBigText() {
        const txt = el('bigInp').value.toLowerCase(), emo = el('bigEmo').value || '▓', bg = el('bigBg').value || '░';
        let res = "";
        for(let i=0; i<5; i++) {
            for(let char of txt) {
                const pattern = bigMap[char] ? bigMap[char].split('\n')[i] : "000";
                res += pattern.replace(/1/g, emo).replace(/0/g, bg) + bg;
            }
            res += "\n";
        }
        el('outBig').innerHTML = "";
        const div = document.createElement('div'); div.className = 'card';
        div.innerHTML = `<div class="head"><span class="meta">Big Art</span></div><div class="big-text-preview">${res}</div><div class="actions"><button class="copy" onclick="doCopy(\`${res}\`)">COPY</button></div>`;
        el('outBig').appendChild(div);
    }

    function genGamerNames() {
        const pres = ["꧁","★","☠️","⚡","♛","✨"], sufs = ["꧂","★","☠️","⚡","♛","✨"], mids = ["Sniper","Killer","Ghost","Alpha","Legend","Devil","Shadow","Venom","Zihad"], decs = ["༒", "•", "x", "pro"];
        el('outGamer').innerHTML = "";
        for(let i=0; i<15; i++) {
            const name = pres[Math.floor(Math.random()*pres.length)] + decs[Math.floor(Math.random()*decs.length)] + mids[Math.floor(Math.random()*mids.length)] + sufs[Math.floor(Math.random()*sufs.length)];
            makeCard(name, "Gamer Tag", el('outGamer'));
        }
    }

    function makeCard(txt, title, cont, isGrid=false) {
        const div = document.createElement('div'); div.className = isGrid ? 'grid-card' : 'card';
        const safe = txt.replace(/'/g, "&apos;").replace(/`/g, "\\`"), isFav = favs.includes(txt);
        if(isGrid) div.innerHTML = `<span class="grid-text">${txt}</span><button class="btn copy" style="width:auto; padding:0 12px;" onclick="doCopy('${safe}')">📋</button>`;
        else div.innerHTML = `<div class="head"><span class="meta">${title}</span><button class="btn fav ${isFav?'active':''}" onclick="doFav(this, '${safe}')">❤️</button></div><div class="text">${txt.replace(/</g, "&lt;")}</div><div class="actions"><button class="copy" onclick="doCopy('${safe}')">COPY</button><button class="btn share" onclick="doShare('${safe}')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg></button></div>`;
        cont.appendChild(div);
    }

    function generateRepeat() {
        const t = el('repTxt').value, c = el('repCnt').value, nl = el('repNewLine').checked, sep = el('repSep').value;
        if(!t || !c) return;
        let res = ""; for(let i=0; i<c; i++) { res += t + (i == c-1 ? '' : sep); if(nl) res += "\n"; }
        el('outRep').innerHTML = ""; makeCard(res.trim(), "Repeated", el('outRep'));
    }

    async function doCopy(txt) { vibrate(); try { await navigator.clipboard.writeText(txt); showToast(); triggerAd(); } catch(e) { const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); showToast(); triggerAd(); } }
    async function doShare(txt) { vibrate(); if(navigator.share) { try { await navigator.share({ title: 'FontMasterX', text: txt }); } catch(e) {} } else { doCopy(txt); } }
    function doFav(btn, txt) { vibrate(); const idx = favs.indexOf(txt); if(idx > -1) { favs.splice(idx, 1); btn.classList.remove('active'); } else { favs.push(txt); btn.classList.add('active'); } localStorage.setItem('favs', JSON.stringify(favs)); if(el('favorites').classList.contains('active')) renderFavs(); }
    function renderFavs() { el('outFav').innerHTML = favs.length ? "" : "<p style='text-align:center;color:var(--sub);margin-top:20px'>No favorites saved yet.</p>"; favs.forEach(t => makeCard(t, "Saved", el('outFav'))); }
    function switchTab(id, btn) { vibrate(); document.querySelectorAll('.content').forEach(d => d.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); el(id).classList.add('active'); btn.classList.add('active'); window.scrollTo(0,0); if(id === 'favorites') renderFavs(); }
    function showToast() { const t = el('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2000); }
    function vibrate() { if(navigator.vibrate) navigator.vibrate(45); }

    inp.addEventListener('input', renderStyler);
    syms.forEach(s => makeCard(s, "", el('outDecor'), true));
    renderStyler(); renderFavs();
</script>
