            --bg-dark: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);

            --glass-highlight: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --accent-cyan: #00f2ff;
            --accent-pink: #bd00ff;
            --accent-fire: #ff4d4d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { 
            background-color: var(--bg-dark);
            color: var(--text-main); 
            min-height: 100vh;
            display: flex; flex-direction: column; overflow-x: hidden; position: relative;
        }

        .bg-mesh {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(189, 0, 255, 0.08), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(0, 242, 255, 0.08), transparent 25%);
            animation: bgPulse 10s ease-in-out infinite alternate;
        }
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }
        @keyframes bgPulse { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.1); opacity: 1; } }

        .app { width: 100%; max-width: 600px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; position: relative; }

        /* HEADER & INSTALL BUTTON */
        header { padding: 45px 20px 20px; text-align: center; position: relative; }
        
        #installBtn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--accent-cyan);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
            transition: 0.3s;
            z-index: 1000;
        }
        #installBtn:hover {
            transform: scale(1.1);
            background: rgba(0, 242, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        header h1 { 
            font-weight: 900; font-size: 42px; letter-spacing: -1px; text-transform: uppercase;
            background: linear-gradient(to bottom, #fff 40%, #a5b4fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.15));
            line-height: 1; margin-bottom: 8px;
        }
        .header-credit {
            font-size: 13px; color: var(--text-sub); letter-spacing: 2px; font-weight: 600;
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,0.05); padding: 6px 16px; border-radius: 20px;
            border: 1px solid var(--glass-border);
        }
        .zihad-name {
            font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 14px; text-transform: uppercase;
            background: linear-gradient(90deg, #ff00cc, #ff3366, #ffcc00);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            filter: drop-shadow(0 0 5px rgba(255, 0, 85, 0.4));

        @keyframes shine { to { background-position: 200% center; } }

        /* TABS */
        .tabs-wrapper { position: sticky; top: 10px; z-index: 100; padding: 0 15px; margin-bottom: 10px; }
        .tabs { display: flex; overflow-x: auto; scrollbar-width: none; gap: 8px; padding: 8px; background: rgba(10, 10, 12, 0.8); backdrop-filter: blur(20px); border-radius: 16px; border: 1px solid var(--glass-border); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); }

        .tab-btn { flex: 0 0 auto; padding: 10px 18px; background: transparent; border: 1px solid transparent; border-radius: 10px; color: var(--text-sub); font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 0.5px; }
        .tab-btn.active { background: rgba(255, 255, 255, 0.1); color: #fff; border-color: var(--glass-highlight); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }

        textarea::placeholder, input::placeholder { color: rgba(255,255,255,0.3); }
        .controls-row { display: flex; gap: 10px; padding: 0 15px 15px 15px; }

        .card { background: linear-gradient(145deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%); border: 1px solid var(--glass-border); border-top-color: var(--glass-highlight); border-left-color: var(--glass-highlight); padding: 22px; margin-bottom: 16px; border-radius: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0, 242, 255, 0.15); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .meta { font-size: 11px; color: var(--accent-cyan); font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.9; }
        .text { font-size: 20px; line-height: 1.6; color: #eee; white-space: pre-wrap; word-break: break-word; font-weight: 400; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .big-text-preview { font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 11px; white-space: pre; overflow-x: auto; padding: 20px; background: rgba(0,0,0,0.4); border-radius: 14px; border: 1px solid var(--glass-border); color: var(--accent-cyan); }
        
        .actions { display: flex; gap: 10px; }
        .btn-icon { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--text-sub); width: 48px; height: 48px; border-radius: 14px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 18px; transition: 0.2s; }
        .fav.active { color: var(--accent-fire); border-color: var(--accent-fire); background: rgba(255, 77, 77, 0.1); animation: heartPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        .copy-btn { flex-grow: 1; height: 48px; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink)); border: none; color: #fff; font-weight: 800; padding: 0 24px; font-size: 14px; text-transform: uppercase; border-radius: 14px; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(0, 242, 255, 0.25); cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,0.3); transition: 0.2s; }

        .gen-btn:active { transform: scale(0.98); }

        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-card { background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 18px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }

        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

</head>

    // ✦ MORE DECORATIONS (prefix/suffix) ✦

    ];
    const gamerDecs = [
        "꧁", "꧂", "★", "☠️", "⚡", "♛", "✨", "⚔️", "❄️", "🔥", "🌪️", "🦅", "🐉", "༒", "•", "_", "⎛", "⎞", "x", "X", "⧸", "⧹", "『", "』", "⌜", "⌝"
    ];

    function toLeet(str) { return str.replace(/[aAeEiIoOsStT]/g, m => ({'a':'4','A':'4','e':'3','E':'3','i':'1','I':'1','o':'0','O':'0','s':'5','S':'5','t':'7','T':'7'}[m])); }

    function transform(txt, fnt) { 
        return [...txt].map(c => { 
            if(fnt.mark) return (c === ' ') ? ' ' : c + fnt.mark; 
            let i = normal.indexOf(c); 
            return (i > -1 && fnt.m && fnt.m[i]) ? fnt.m[i] : c; 
        }).join(''); 
    }

    function renderStyler() {
        const txt = el('inp').value || "FontMasterX"; 
        const container = el('outStyler'); container.innerHTML = ""; 
        const frag = document.createDocumentFragment();
        baseFonts.forEach(f => { 
            decorations.forEach((d, idx) => { 
                if(txt.length > 25 && idx > 4) return; 
                let stylized = transform(txt, f); 
                frag.appendChild(createCardElement(d.p + stylized + d.s, f.n + (d.p ? " + Deco" : ""))); 
            }); 
        });
        container.appendChild(frag);
    }

    const bigMap = {'a':"010\n101\n111\n101\n101", 'b':"110\n101\n110\n101\n110", 'c':"011\n100\n100\n100\n011", 'd':"110\n101\n101\n101\n110", 'e':"111\n100\n111\n100\n111", 'f':"111\n100\n110\n100\n100", 'g':"011\n100\n100\n101\n011", 'h':"101\n101\n111\n101\n101", 'i':"111\n010\n010\n010\n111", 'j':"001\n001\n001\n101\n011", 'k':"101\n101\n110\n101\n101", 'l':"100\n100\n100\n100\n111", 'm':"101\n111\n101\n101\n101", 'n':"111\n101\n101\n101\n101", 'o':"010\n101\n101\n101\n010", 'p':"110\n101\n110\n100\n100", 'r':"110\n101\n110\n101\n101", 's':"011\n100\n010\n001\n110", 't':"111\n010\n010\n010\n010", 'u':"101\n101\n101\n101\n011", 'v':"101\n101\n101\n101\n010", 'w':"101\n101\n101\n111\n101", 'x':"101\n101\n010\n101\n101", 'y':"101\n101\n010\n010\n010", 'z':"111\n001\n010\n100\n111", ' ':"000\n000\n000\n000\n000", '0':"111\n101\n101\n101\n111", '1':"010\n110\n010\n010\n111"};
    function genBigText() {
        const txt = el('bigInp').value.toLowerCase(), emo = el('bigEmo').value || '▓', bg = el('bigBg').value || '░'; let res = "";
        for(let i=0; i<5; i++) { for(let char of txt) { const pattern = bigMap[char] ? bigMap[char].split('\n')[i] : "000"; res += pattern.replace(/1/g, emo).replace(/0/g, bg) + bg; } res += "\n"; }
        el('outBig').innerHTML = ""; const div = document.createElement('div'); div.className = 'card'; div.innerHTML = `<div class="card-header"><span class="meta">Preview</span></div><div class="big-text-preview">${res}</div><div class="actions" style="margin-top:10px"><button class="copy-btn" onclick="doCopy(\`${res.replace(/`/g, "\\`")}\`)">COPY ART</button></div>`; el('outBig').appendChild(div);
    }

    // ✦ ENHANCED GAMER GENERATOR (20 items, more variety) ✦
    function genGamerNames() {
        const cont = el('outGamer'); cont.innerHTML = ""; const frag = document.createDocumentFragment();
        for(let i=0; i<20; i++) {
            let name = "";
            const mode = Math.floor(Math.random() * 8);
            const base = gamerWords[Math.floor(Math.random() * gamerWords.length)];
            const adj = gamerAdjs[Math.floor(Math.random() * gamerAdjs.length)];
            const dec1 = gamerDecs[Math.floor(Math.random() * gamerDecs.length)];
            const dec2 = gamerDecs[Math.floor(Math.random() * gamerDecs.length)];
            const num = Math.floor(Math.random() * 999) + 1;

            switch(mode) {
                case 0: name = dec1 + base + (Math.random()>0.5 ? dec1 : dec2); break;
                case 1: name = toLeet(base); break;
                case 2: name = adj + base; break;
                case 3: name = "[" + base.substring(0,3).toUpperCase() + "] " + adj; break;
                case 4: name = "Xx_" + base + (Math.random()>0.5 ? "_" + adj : "") + "_xX"; break;
                case 5: name = base + (Math.random()>0.3 ? num : (Math.random()>0.5 ? "69" : "420")); break;
                case 6: name = toLeet(adj) + "_" + toLeet(base); break;
                case 7: name = dec1 + " " + adj + " " + base + " " + dec2; break;
                default: name = base + adj;
            }
            if (!name) name = "PHANTOM";
            frag.appendChild(createCardElement(name, "Gamer Tag " + (i+1)));
        }
        cont.appendChild(frag);
    }

    function createCardElement(txt, title) {
        const div = document.createElement('div'); div.className = 'card'; 
        const safe = txt.replace(/'/g, "&apos;").replace(/`/g, "\\`"); 
        const isFav = favs.includes(txt);
        div.innerHTML = `<div class="card-header"><span class="meta">${title}</span><button class="btn-icon fav ${isFav?'active':''}" onclick="doFav(this, '${safe}')"><svg width="20" height="20" viewBox="0 0 24 24" fill="${isFav?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></button></div><div class="text">${txt.replace(/</g, "&lt;")}</div><div class="actions"><button class="copy-btn" onclick="doCopy('${safe}')">Copy</button><button class="btn-icon" onclick="doShare('${safe}')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg></button></div>`; 
        return div;
    }

    function generateRepeat() { 
        const t = el('repTxt').value, c = el('repCnt').value, nl = el('repNewLine').checked, sep = el('repSep').value; 
        if(!t || !c) return; 
        let res = ""; 
        for(let i=0; i<c; i++) { 
            res += t + (i == c-1 ? '' : sep); 
            if(nl) res += "\n"; 
        } 
        el('outRep').innerHTML = ""; 
        el('outRep').appendChild(createCardElement(res.trim(), "Repeater Result")); 
    }
    
    function createGridCard(txt) { 
        const div = document.createElement('div'); div.className = 'grid-card'; 
        const safe = txt.replace(/'/g, "&apos;").replace(/`/g, "\\`"); 
        div.innerHTML = `<span class="grid-text">${txt}</span><button class="btn-icon" style="width:36px; height:36px; flex:0 0 36px;" onclick="doCopy('${safe}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>`; 
        return div; 
    }

    // ✦ FIXED AD OPENING: called directly after copy (user gesture) ✦
    async function doCopy(txt) { 
        vibrate(); 
        try { 
            await navigator.clipboard.writeText(txt); 
            showToast(); 
            triggerAd(); // direct call, no setTimeout
        } catch(e) { 
            const t = document.createElement("textarea"); 
            t.value = txt; 
            document.body.appendChild(t); 
            t.select(); 
            document.execCommand("copy"); 
            t.remove(); 
            showToast(); 
            triggerAd(); 
        } 
    }
    
    async function doShare(txt) { 
        vibrate(); 
        if(navigator.share) { 
            try { await navigator.share({ title: 'FontMasterX', text: txt }); } catch(e) {} 
        } else { doCopy(txt); } 
    }
    
    function doFav(btn, txt) { 
        vibrate(); 
        const idx = favs.indexOf(txt); 
        const svg = btn.querySelector('svg'); 
        if(idx > -1) { 
            favs.splice(idx, 1); 
            btn.classList.remove('active'); 
            svg.setAttribute('fill', 'none'); 
        } else { 
            favs.push(txt); 
            btn.classList.add('active'); 
            svg.setAttribute('fill', 'currentColor'); 
        } 
        localStorage.setItem('favs', JSON.stringify(favs)); 
        if(el('favorites').classList.contains('active')) renderFavs(); 
    }
    
    function renderFavs() { 
        const c = el('outFav'); 
        c.innerHTML = ""; 
        if(!favs.length) c.innerHTML = "<p style='text-align:center;color:var(--text-sub);margin-top:40px; font-weight:500;'>No favorites saved yet.</p>"; 
        else favs.forEach(t => c.appendChild(createCardElement(t, "Saved Style"))); 
    }
    
    function switchTab(id, btn) { 
        vibrate(); 
        document.querySelectorAll('.content').forEach(d => d.classList.remove('active')); 
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); 
        el(id).classList.add('active'); 
        btn.classList.add('active'); 
        window.scrollTo({ top: 0, behavior: 'smooth' }); 
        if(id === 'favorites') renderFavs(); 
    }
    
    function showToast() { 
        const t = el('toast'); 
        t.classList.add('show'); 
        setTimeout(()=>t.classList.remove('show'), 2000); 
    }
    
    function vibrate() { if(navigator.vibrate) navigator.vibrate(40); }

    // init
    el('inp').addEventListener('input', renderStyler); 
    const decorFrag = document.createDocumentFragment(); 
    syms.forEach(s => decorFrag.appendChild(createGridCard(s))); 
    el('outDecor').appendChild(decorFrag); 
    renderStyler();
</script>
