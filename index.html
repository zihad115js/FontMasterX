        :root {
            --bg: #030305;
            --card-bg: rgba(20, 20, 28, 0.7);
            --text: #ffffff;
            --sub: #94a3b8;
            --accent: #00f2ff; /* Cyber Cyan */
            --accent-2: #bd00ff; /* Cyber Purple */
            --border: rgba(255, 255, 255, 0.08);
            --glow: 0 0 15px rgba(0, 242, 255, 0.2);
            --success: #00ff9d;
            --love: #ff0055;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { 
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(189, 0, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(0, 242, 255, 0.1) 0%, transparent 50%);
            color: var(--text); height: 100vh; display: flex; justify-content: center; overflow: hidden; 
        }
        
        .app { width: 100%; max-width: 600px; display: flex; flex-direction: column; height: 100%; position: relative; }

        /* --- HEADER --- */
        header { 
            padding: 18px; text-align: center; 
            border-bottom: 1px solid var(--border); 
            background: rgba(3, 3, 5, 0.8); backdrop-filter: blur(15px);
        }
        h1 { 
            font-weight: 900; font-size: 24px; letter-spacing: 2px; text-transform: uppercase;
            background: linear-gradient(135deg, #fff 40%, var(--accent)); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 5px rgba(0, 242, 255, 0.3));
        }

        /* --- STICKY TABS --- */
        .tabs-container { 
            background: rgba(3, 3, 5, 0.9); border-bottom: 1px solid var(--border); 
            z-index: 50; backdrop-filter: blur(10px);
            position: sticky; top: 0;
        }
        .tabs { display: flex; overflow-x: auto; scrollbar-width: none; gap: 5px; padding: 0 10px; }
        .tab-btn { 
            flex: 0 0 auto; padding: 15px 14px; background: transparent; border: none; 
            color: var(--sub); font-weight: 600; font-size: 13px; cursor: pointer; 
            position: relative; transition: 0.3s; 
        }
        .tab-btn.active { color: #fff; text-shadow: 0 0 12px var(--accent); }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: 0; left: 15%; width: 70%; height: 3px; 
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            border-radius: 10px 10px 0 0; box-shadow: 0 -2px 10px var(--accent);
        }

        /* --- CONTENT --- */
        /* Scrollable container for the whole app content */
        .main-scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
        .content { display: none; padding: 15px; padding-bottom: 100px; animation: fadeIn 0.4s ease; }
        .content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- INPUTS --- */
        .input-box { 
            padding: 20px; background: rgba(255,255,255,0.03); border-radius: 16px; border: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        textarea, input, select { 
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: #fff; 
            padding: 16px; border-radius: 12px; font-size: 16px; outline: none; transition: 0.3s; 
            font-family: 'Outfit', sans-serif;
        }
        textarea:focus, input:focus { border-color: var(--accent); box-shadow: var(--glow); }

        /* --- CARDS --- */
        .card { 
            background: var(--card-bg); border: 1px solid var(--border); padding: 18px; margin-bottom: 12px; 
            border-radius: 16px; display: flex; flex-direction: column; gap: 12px; 
            backdrop-filter: blur(10px); transition: 0.2s; position: relative; overflow: hidden;
        }
        .card:active { transform: scale(0.98); }
        .card::before {
            content: ''; position: absolute; left: 0; top: 0; width: 3px; height: 100%;
            background: linear-gradient(to bottom, var(--accent), var(--accent-2));
            opacity: 0.6;
        }
        
        .head { display: flex; justify-content: space-between; align-items: center; }
        .meta { font-size: 10px; color: var(--sub); font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; }
        .text { font-size: 18px; line-height: 1.6; color: #fff; white-space: pre-wrap; word-break: break-word; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        
        .big-text-preview { font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 10px; white-space: pre; overflow-x: auto; padding: 15px; background: #000; border-radius: 10px; border: 1px solid var(--border); color: var(--accent); text-align: center; }
        
        /* Grid Layout */
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid-card { background: var(--card-bg); border: 1px solid var(--border); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .grid-text { font-size: 20px; }

        /* --- BUTTONS --- */
        .actions { display: flex; gap: 8px; align-self: flex-end; }
        .btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--sub); width: 42px; height: 42px; border-radius: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 18px; transition: 0.2s; }
        .fav.active { color: var(--love); border-color: var(--love); background: rgba(255, 0, 85, 0.15); box-shadow: 0 0 15px rgba(255, 0, 85, 0.3); }
        .share:hover { color: var(--accent); border-color: var(--accent); background: rgba(0, 242, 255, 0.1); }
        
        .copy { 
            background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; 
            color: #fff; font-weight: 800; width: auto; padding: 0 20px; font-size: 13px; 
            text-transform: uppercase; letter-spacing: 1px; border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.3);
        }

        .gen-btn { 
            padding: 16px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); 
            color: #fff; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 15px; 
            width: 100%; box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); transition: 0.2s; 
            text-transform: uppercase; letter-spacing: 1px;
        }
        .gen-btn:active { transform: scale(0.98); opacity: 0.9; }

        /* Toast */
        #toast { 
            position: fixed; bottom: -80px; left: 50%; transform: translateX(-50%); 
            background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); color: #000; 
            padding: 12px 25px; border-radius: 50px; font-weight: 800; font-size: 14px; 
            opacity: 0; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            z-index: 100; box-shadow: 0 0 30px rgba(255,255,255,0.2); display: flex; align-items: center; gap: 8px; 
        }
        #toast.show { opacity: 1; bottom: 40px; }
    </style>
</head>

        div.className = 'card';
        div.innerHTML = `
            <div class="head"><span class="meta">Big Art</span></div>
            <div class="big-text-preview">${res}</div>
            <div class="actions"><button class="copy" onclick="doCopy(\`${res}\`)">COPY</button></div>`;
        el('outBig').appendChild(div);
    }

    // --- 3. GAMER NAMES ---
    function genGamerNames() {
        const pres = ["꧁","★","☠️","⚡","♛","👹","ॐ","✨","乂","Ðark","🔥"];
        const sufs = ["꧂","★","☠️","⚡","♛","👹","ॐ","✨","乂","🔥","™"];
        const mids = ["Sniper","Killer","Joker","Viper","Ghost","Alpha","Legend","Ninja","Slayer","Devil","Wolf","Titan","Shadow","Storm","Venom","Reaper","Zeus","Hacker"];
        const decorators = ["༒", "•", "x", "pro", "god", "ff", "999", "ip", "v2"];
        
        el('outGamer').innerHTML = "";
        for(let i=0; i<15; i++) {
            const pre = pres[Math.floor(Math.random()*pres.length)];
            const suf = sufs[Math.floor(Math.random()*sufs.length)];
            const mid = mids[Math.floor(Math.random()*mids.length)];
            const dec = decorators[Math.floor(Math.random()*decorators.length)];
            makeCard(pre + dec + mid + dec + suf, "Gamer Tag", el('outGamer'));
        }
    }

    // --- COMMON FUNCTIONS ---
    function makeCard(txt, title, cont, isGrid=false) {
        const div = document.createElement('div');
        div.className = isGrid ? 'grid-card' : 'card';
        const safe = txt.replace(/'/g, "&apos;").replace(/`/g, "\\`");
        const isFav = favs.includes(txt);
        
        if(isGrid) {
            div.innerHTML = `<span class="grid-text">${txt}</span><button class="btn copy" style="width:auto; padding:0 15px;" onclick="doCopy('${safe}')">COPY</button>`;
        } else {
            div.innerHTML = `
                <div class="head"><span class="meta">${title}</span><button class="btn fav ${isFav?'active':''}" onclick="doFav(this, '${safe}')">❤️</button></div>
                <div class="text">${txt.replace(/</g, "&lt;")}</div>
                <div class="actions">
                    <button class="copy" onclick="doCopy('${safe}')">COPY</button>
                    <button class="btn share" onclick="doShare('${safe}')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                    </button>
                </div>`;
        }
        cont.appendChild(div);
    }

    function generateRepeat() {
        const t = el('repTxt').value, c = el('repCnt').value;
        const newLine = el('repNewLine').checked;
        const sep = el('repSep').value;
        
        if(!t || !c) return;
        
        let res = "";
        for(let i=0; i<c; i++) {
            res += t + (i === c-1 ? '' : sep); 
            if(newLine) res += "\n";
        }
        
        el('outRep').innerHTML = "";
        makeCard(res.trim(), "Repeated Text", el('outRep'));
    }

    async function doCopy(txt) {
        vibrate();
        try { 
            await navigator.clipboard.writeText(txt); 
            showToast(); 
            triggerAdLoop(); // 🔄 Calls the link loop
        }
        catch(e) { 
            const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); 
            t.select(); document.execCommand("copy"); t.remove(); showToast(); 
            triggerAdLoop(); // 🔄 Calls the link loop
        }
    }
    
    // NATIVE SHARE
    async function doShare(txt) {
        vibrate();
        if(navigator.share) {
            try { await navigator.share({ title: 'FontMasterX', text: txt }); } 
            catch(e) { /* Share failed */ }
        } else {
            doCopy(txt);
            showToast("Share not supported, Copied!");
        }
    }
    
    function doFav(btn, txt) {
        vibrate();
        const idx = favs.indexOf(txt);
        if(idx > -1) { favs.splice(idx, 1); btn.classList.remove('active'); }
        else { favs.push(txt); btn.classList.add('active'); }
        localStorage.setItem('favs', JSON.stringify(favs));
        if(el('favorites').classList.contains('active')) renderFavs();
    }
    function renderFavs() {
        el('outFav').innerHTML = favs.length ? "" : "<p style='text-align:center;color:var(--sub);margin-top:20px'>No favorites saved yet.</p>";
        favs.forEach(t => makeCard(t, "Saved", el('outFav')));
    }

    function switchTab(id, btn) {
        vibrate();
        document.querySelectorAll('.content').forEach(d => d.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        el(id).classList.add('active');
        btn.classList.add('active');
        if(id === 'favorites') renderFavs();
    }
    function showToast(msg) { 
        const t = el('toast'); 
        if(msg) t.innerHTML = `<span>⚡</span> ${msg}`;
        t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2000); 
    }
    function vibrate() { if(navigator.vibrate) navigator.vibrate(40); }

    // INIT
    inp.addEventListener('input', renderStyler);
    syms.forEach(s => makeCard(s, "", el('outDecor'), true));
    renderStyler(); renderFavs();
</script>
</body>
</html>
