        .fav-btn.favorited { color: var(--love); background: #4c1d29; }

    });

    // --- REPEATER LOGIC ---
    document.getElementById('generateRepeated').addEventListener('click', () => {
        const text = document.getElementById('repeaterInput').value;
        const count = parseInt(document.getElementById('repeaterCount').value);
        const resultContainer = document.getElementById('repeaterResultCard');
        
        if (!text || !count || count <= 0) { resultContainer.innerHTML = `<p style="color:var(--love); text-align:center;">Please enter text and a valid count.</p>`; return; }
        if (count > 2000) { resultContainer.innerHTML = `<p style="color:var(--love); text-align:center;">Count cannot exceed 2000.</p>`; return; }
        
        const resultText = (text + " ").repeat(count).trim();
        resultContainer.innerHTML = `
            <div class="card">
                <div class="preview">${resultText.replace(/</g, "&lt;")}</div>
                <div class="actions">
                    <button class="action-btn" data-text='${resultText.replace(/'/g, "&apos;")}' onclick="handleCopy(this)">📋</button>
                    <button class="action-btn whatsapp-btn" data-text='${resultText.replace(/'/g, "&apos;")}' onclick="shareToWhatsApp(this)">💬</button>
                </div>
            </div>`;
    });

    // --- INITIALIZATION ---
    inputText.addEventListener('input', renderStyler);
    renderStyler(); renderFavorites(); renderArt(); renderDecor();
</script>
</body>
</html>
